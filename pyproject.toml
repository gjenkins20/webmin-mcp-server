[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webmin-mcp-server"
version = "0.1.1"
description = "MCP server for managing Linux systems via Webmin"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "gjenkins20", email = "glj_dev_gplay.maritime207@passinbox.com" }
]
keywords = ["mcp", "webmin", "linux", "system-administration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/gjenkins20/webmin-mcp-server"
Repository = "https://github.com/gjenkins20/webmin-mcp-server"
Issues = "https://github.com/gjenkins20/webmin-mcp-server/issues"
Documentation = "https://github.com/gjenkins20/webmin-mcp-server/blob/main/docs/api-reference.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
webmin-mcp = "src.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
